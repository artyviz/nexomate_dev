services:
  - type: web
    name: nexomate-lead-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: BUSINESS_NAME
        value: Nexomate
      - key: DEMO_GROQ_MODEL
        value: openai/gpt-oss-20b
